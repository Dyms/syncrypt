name: Release

# Cut by a human pushing a version tag (e.g. "1.0.0-beta.1"; a leading "v" is
# tolerated but normalized). The workflow verifies the tag matches the plugin
# version everywhere, runs the OFFLINE gate, builds, and fills the GitHub
# Release with the assets BRAT installs from. No npm publishing here.
#
# DELIBERATELY HERMETIC: no service containers, no Docker, no network backends.
# Packaging is the release's job; live S3/WebDAV integration is CI's job (see
# ci.yml). A registry outage must never be able to block a release.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Explicitly empty: the live S3/WebDAV suites read these and skip when
      # unset or empty (see providers/*/test/live*.ts). Stated rather than
      # omitted so "the live suites must skip here" is a visible decision.
      SYNCRYPT_S3_TEST_ENDPOINT: ""
      SYNCRYPT_WEBDAV_TEST_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci

      - name: Verify tag matches the plugin version everywhere
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./packages/obsidian-plugin/manifest.json').version")
          ROOT=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./packages/obsidian-plugin/package.json').version")
          KEY=$(node -p "Object.keys(require('./packages/obsidian-plugin/versions.json')).includes('$TAG')")
          echo "tag=$TAG manifest=$MANIFEST root=$ROOT package=$PKG versions-has-tag=$KEY"
          test "$TAG" = "$MANIFEST" || { echo "::error::tag != package manifest version"; exit 1; }
          test "$TAG" = "$ROOT"     || { echo "::error::tag != root manifest version"; exit 1; }
          test "$TAG" = "$PKG"      || { echo "::error::tag != package.json version"; exit 1; }
          test "$KEY" = "true"      || { echo "::error::versions.json lacks the tag version"; exit 1; }

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

      # Runs everything that needs no external backend: core, crypto, sdk, the
      # filesystem provider, the obsidian-plugin suites (incl. the packaging /
      # bundle-guard tests), and the WebDAV conformance + encrypted-sync suites
      # against an in-process `webdav-server`. The env-gated live S3 specs and
      # the external-WebDAV block skip.
      - name: Test (offline suite)
        run: npm test

      - name: Build plugin
        run: npm run build -w @syncrypt/obsidian

      - name: Verify release assets were produced
        run: |
          DIST=packages/obsidian-plugin/dist
          for f in main.js manifest.json versions.json; do
            test -s "$DIST/$f" || { echo "::error::missing or empty release asset: $DIST/$f"; exit 1; }
          done
          ls -l "$DIST"

      - name: Create GitHub Release with plugin assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIST=packages/obsidian-plugin/dist
          ASSETS="$DIST/main.js $DIST/manifest.json $DIST/versions.json"
          if [ -f "$DIST/styles.css" ]; then ASSETS="$ASSETS $DIST/styles.css"; fi
          gh release create "$TAG" $ASSETS \
            --title "Syncrypt ${GITHUB_REF_NAME#v}" \
            --notes "Beta release. Install via BRAT: add beta plugin → Dyms/syncrypt. See docs/install.md." \
            --prerelease
